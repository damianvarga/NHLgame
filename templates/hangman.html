<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}" />
</head>
<body>
    <main class="container">
        <h1 class="page-title">Hangman</h1>

        <!-- HUD: word display + lives counter -->
        <section class="hud" aria-label="Game status">
            <div id="word-display" class="word-display" aria-label="current word"></div>
            <br>
            <div id="error-counter" class="error-counter" aria-live="polite">Lives left: 5</div>
        </section>

        <!-- On-screen keyboard -->
        <div id="keyboard" class="keyboard" role="group" aria-label="Alphabet keys">
            <div class="row">
                <button type="button" class="key" data-letter="A">A</button>
                <button type="button" class="key" data-letter="B">B</button>
                <button type="button" class="key" data-letter="C">C</button>
                <button type="button" class="key" data-letter="D">D</button>
                <button type="button" class="key" data-letter="E">E</button>
                <button type="button" class="key" data-letter="F">F</button>
                <button type="button" class="key" data-letter="G">G</button>
                <button type="button" class="key" data-letter="H">H</button>
                <button type="button" class="key" data-letter="I">I</button>
                <button type="button" class="key" data-letter="J">J</button>
                <button type="button" class="key" data-letter="K">K</button>
                <button type="button" class="key" data-letter="L">L</button>
                <button type="button" class="key" data-letter="M">M</button>
            </div>
            <div class="row">
                <button type="button" class="key" data-letter="N">N</button>
                <button type="button" class="key" data-letter="O">O</button>
                <button type="button" class="key" data-letter="P">P</button>
                <button type="button" class="key" data-letter="Q">Q</button>
                <button type="button" class="key" data-letter="R">R</button>
                <button type="button" class="key" data-letter="S">S</button>
                <button type="button" class="key" data-letter="T">T</button>
                <button type="button" class="key" data-letter="U">U</button>
                <button type="button" class="key" data-letter="V">V</button>
                <button type="button" class="key" data-letter="W">W</button>
                <button type="button" class="key" data-letter="X">X</button>
                <button type="button" class="key" data-letter="Y">Y</button>
                <button type="button" class="key" data-letter="Z">Z</button>
            </div>
        </div>
        <h1>Words</h1>
        <ul>
        {% for w in words %}
            <li>{{ w.word }}</li>
        {% endfor %}
        </ul>
        <noscript>
            JavaScript is required to play Hangman. Please enable JavaScript.
        </noscript>
    </main>

    <!-- Load JS after the DOM -->
    <script src="{{ url_for('static', path='/hangman.js') }}" defer></script>
</body>
</html>
