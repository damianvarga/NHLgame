<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <title>Guess The Player</title>
</head>
<body>
    <div id="team-names">
        <h3>Teams played for:</h3>
        <ul>
            {% if teams %}
                {% for team in teams %}
                    <li>{{ team }}</li>
                {% endfor %}
            {% else %}
                <li>No team data available</li>
            {% endif %}
        </ul>
    </div>

    <form action="/guess" method="post">
        <!-- Hidden inputs -->
        <input type="hidden" name="correct_name" value="{{ player_name }}">
        <input type="hidden" name="teams" value="{{ ','.join(teams or []) }}">

        <input type="text" name="player_name" placeholder="Enter player name" required>
        <button type="submit" class="grid-buttons">Guess</button>
    </form>

    {% if result %}
        <h2 style="color: {% if result == 'Correct!' %}green{% else %}red{% endif %};">
            {{ result }}
        </h2>
    {% endif %}
</body>
</html>
