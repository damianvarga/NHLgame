<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <title>Guess The Player</title>
</head>
<body>
    <div id="team-names">
        <h3>Teams played for:</h3>
        {% if teams %}
            {% for team in teams %}
                {{ team }}<br>
            {% endfor %}
        {% else %}
            No team data available
        {% endif %}
    </div>
    <br>
    <form id="guess-form" action="/guess" method="post">
        <input type="hidden" name="correct_name" value="{{ player_name }}">
        <input type="hidden" name="teams" value="{{ ','.join(teams or []) }}">
        <input type="text" name="player_name" placeholder="Enter player name" required>
        <button type="submit" class="grid-buttons">Guess</button>
    </form>

    {% if result %}
        <h2 id="result-text"
            style="color: {% if result == 'Correct!' %}lime{% else %}red{% endif %};">
            {{ result }}
        </h2>
    {% endif %}

    <script>
        // If the server says "Correct!", show it briefly, then reload for a new player
        const result = "{{ result or '' }}";
        if (result === "Correct!") {
            setTimeout(() => {
                window.location.href = "/guess";
            }, 1000); // delay in milliseconds (1s)
        }
    </script>
</body>
</html>
